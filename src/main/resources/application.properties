spring.application.name=TravelManagementSystem

server.port=8080

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================================================
# FILE UPLOADS
# =========================================================

app.upload.dir=uploads/destinations

# =========================================================
# JWT
# =========================================================

jwt.secret=TravelAI-Local-Secret-Key-2026-Change-In-Production
jwt.expiration=86400000

# =========================================================
# MAIL  (HOW TO ENABLE REAL OTP EMAIL)
# =========================================================
# STEP 1: Use a Gmail account (e.g. yourname@gmail.com)
# STEP 2: Enable 2-Step Verification in Google Account settings
# STEP 3: Go to: Google Account -> Security -> App Passwords
#         Generate an App Password for "Mail" + "Windows Computer"
# STEP 4: Paste your Gmail address below in spring.mail.username
# STEP 5: Paste the 16-character App Password (no spaces) below
# NOTE  : OTP is ONLY sent to the email that is REGISTERED in the DB
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_gmail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_16_char_app_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000