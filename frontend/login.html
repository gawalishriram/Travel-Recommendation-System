<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — TravelSphere</title>
  <meta name="description" content="Login to your TravelSphere account as User or Admin." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:440px">
    <div class="auth-logo">
      <div class="logo-icon">🌐</div>
      <h2>Welcome to TravelSphere</h2>
      <p id="roleSubtitle">Select your role and login to your account</p>
    </div>

    <!-- ROLE SWITCH TABS -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabUser" onclick="switchRole('USER')">
        👤 User Login
      </button>
      <button type="button" class="auth-tab" id="tabAdmin" onclick="switchRole('ADMIN')">
        🛡️ Admin Login
      </button>
    </div>

    <div class="alert alert-danger" id="alertBox"><span>⚠️</span><span id="alertMsg"></span></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email" id="emailLabel">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" required />
        <div class="form-error" id="emailError">Please enter a valid email.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
        <div class="form-error" id="passwordError">Password is required.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg mt-2" id="submitBtn">Login as User</button>
    </form>

    <div id="userFooter" class="mt-3 text-center">
      <div class="auth-divider">or</div>
      <div style="font-size:0.9rem;color:var(--text-secondary)">
        Don't have an account? <a href="register.html" class="text-teal fw-600">Register</a>
      </div>
    </div>

    <div id="adminFooter" class="mt-3 text-center d-none">
      <div class="card" style="padding:0.75rem;font-size:0.8rem;color:var(--text-secondary);background:rgba(255,255,255,0.03);border-color:var(--border)">
        🛡️ Administrator Portal · Manage destinations, users, &amp; dashboard
      </div>
    </div>

    <div class="text-center mt-3" style="font-size:0.85rem">
      <a href="index.html" class="text-muted">← Back to Home</a>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  let currentRole = 'USER';

  // Check URL parameters for role (e.g. login.html?role=admin)
  const urlParams = new URLSearchParams(window.location.search);
  const requestedRole = urlParams.get('role');
  if (requestedRole && requestedRole.toUpperCase() === 'ADMIN') {
    switchRole('ADMIN');
  } else {
    // If already logged in as user or admin
    if (Auth.isUserLoggedIn()) {
      window.location.href = 'user-dashboard.html';
    }
  }

  function switchRole(role) {
    currentRole = role;
    document.getElementById('alertBox').classList.remove('show');

    const tabUser = document.getElementById('tabUser');
    const tabAdmin = document.getElementById('tabAdmin');
    const submitBtn = document.getElementById('submitBtn');
    const subtitle = document.getElementById('roleSubtitle');
    const userFooter = document.getElementById('userFooter');
    const adminFooter = document.getElementById('adminFooter');
    const emailInput = document.getElementById('email');

    if (role === 'ADMIN') {
      tabAdmin.classList.add('active');
      tabUser.classList.remove('active');
      submitBtn.textContent = 'Login as Admin';
      subtitle.textContent = 'Administrator Control Panel Sign In';
      userFooter.classList.add('d-none');
      adminFooter.classList.remove('d-none');
      emailInput.placeholder = 'admin@travelsphere.com';
    } else {
      tabUser.classList.add('active');
      tabAdmin.classList.remove('active');
      submitBtn.textContent = 'Login as User';
      subtitle.textContent = 'Login to your TravelSphere user account';
      userFooter.classList.remove('d-none');
      adminFooter.classList.add('d-none');
      emailInput.placeholder = 'you@example.com';
    }
  }

  const form = document.getElementById('loginForm');
  const btn  = document.getElementById('submitBtn');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    document.getElementById('alertBox').classList.remove('show');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const emailValid = email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    document.getElementById('emailError').classList[emailValid ? 'remove' : 'add']('show');
    document.getElementById('passwordError').classList[!password ? 'add' : 'remove']('show');
    if (!emailValid || !password) return;

    btn.disabled = true;
    btn.textContent = currentRole === 'ADMIN' ? 'Authenticating Admin…' : 'Logging in…';

    try {
      if (currentRole === 'ADMIN') {
        const data = await API.post('/admin/login', { email, password });
        Auth.saveAdmin({ adminId: data.adminId, email: data.email, role: data.role || 'ADMIN', token: data.token });
        API.showToast('Admin Login Successful!', 'success');
        setTimeout(() => window.location.href = 'admin-dashboard.html', 700);
      } else {
        const data = await API.post('/users/login', { email, password });
        Auth.saveUser({ userId: data.userId, name: data.name, email: data.email, token: data.token });
        API.showToast('Welcome back, ' + data.name + '!', 'success');
        setTimeout(() => window.location.href = 'user-dashboard.html', 700);
      }
    } catch(err) {
      document.getElementById('alertMsg').textContent = err.message || 'Invalid email or password.';
      document.getElementById('alertBox').classList.add('show');
      btn.disabled = false;
      btn.textContent = currentRole === 'ADMIN' ? 'Login as Admin' : 'Login as User';
    }
  });
</script>
</body>
</html>
