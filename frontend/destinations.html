<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Destinations — TravelSphere</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-brand">🌐 TravelSphere</a>
  <ul class="nav-links">
    <li><a href="user-dashboard.html">Dashboard</a></li>
    <li><a href="destinations.html" class="active">Destinations</a></li>
    <li><a href="my-bookings.html">My Bookings</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="#" onclick="Auth.logoutUser('login.html')">Logout</a></li>
  </ul>
</nav>

<div class="page-container">
  <div class="page-header d-flex justify-between align-center flex-wrap gap-2">
    <div>
      <h1 class="page-title">Explore Destinations</h1>
      <p class="page-subtitle">Discover amazing places and plan your perfect getaway</p>
    </div>
    <div id="resultsCountBadge" class="badge badge-teal" style="font-size:0.9rem;padding:0.4rem 0.8rem">
      Loading…
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="🔍 Search by name or description…" oninput="onFilterChange()" />
    <select id="filterSeason" onchange="onFilterChange()">
      <option value="">All Seasons</option>
      <option>Summer</option><option>Winter</option><option>Monsoon</option>
      <option>Spring</option><option>Autumn</option><option>Year Round</option>
    </select>
    <select id="filterCategory" onchange="onFilterChange()">
      <option value="">All Categories</option>
      <option>Beach</option><option>Mountain</option><option>Heritage</option>
      <option>Adventure</option><option>Wildlife</option><option>City</option>
      <option>Hill Station</option><option>Spiritual</option>
    </select>
    <select id="sortBy" onchange="onFilterChange()">
      <option value="">Sort By</option>
      <option value="rating">Highest Rated ⭐</option>
      <option value="budgetAsc">Price: Low → High</option>
      <option value="budgetDesc">Price: High → Low</option>
    </select>
    <button class="btn btn-secondary btn-sm" onclick="resetFilters()">Reset Filters</button>
  </div>

  <div id="loader" class="loading-state"><div class="spinner"></div></div>
  <div id="grid" class="grid grid-3" style="display:none"></div>
  
  <div id="empty" class="empty-state d-none">
    <div class="empty-icon">🗺️</div>
    <h3>No destinations found</h3>
    <p class="text-muted">Try adjusting your search criteria or filters</p>
    <button class="btn btn-secondary mt-2" onclick="resetFilters()">Clear Filters</button>
  </div>

  <!-- PAGINATION CONTROLS -->
  <div id="paginationWrapper" class="d-none" style="margin-top:2rem">
    <div class="d-flex justify-between align-center flex-wrap gap-2" style="border-top:1px solid var(--border);padding-top:1.5rem">
      <div id="paginationInfo" class="text-secondary" style="font-size:0.9rem"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<footer class="footer"><p>© 2026 <span>TravelSphere</span>. All rights reserved.</p></footer>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  if (!Auth.requireUser()) throw 0;
  
  const token = Auth.getUserToken();
  const PAGE_SIZE = 10;
  let allDestinations = [];
  let userFavoriteIds = new Set();
  let currentPage = 0;

  async function loadData() {
    try {
      // Fetch destinations and user favorites concurrently
      const [destList, favList] = await Promise.all([
        API.get('/destinations', token),
        API.get('/favorites', token).catch(() => [])
      ]);

      allDestinations = Array.isArray(destList) ? destList : [];
      if (Array.isArray(favList)) {
        userFavoriteIds = new Set(favList.map(f => f.destinationId));
      }

      applyFiltersAndPaginate();
    } catch (err) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('empty').classList.remove('d-none');
    }
  }

  function getFilteredDestinations() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const s = document.getElementById('filterSeason').value;
    const c = document.getElementById('filterCategory').value;
    const sort = document.getElementById('sortBy').value;

    let list = allDestinations.filter(d => {
      const matchName = !q || (d.name && d.name.toLowerCase().includes(q)) || (d.description && d.description.toLowerCase().includes(q));
      const matchSeason = !s || (d.season && d.season.toLowerCase() === s.toLowerCase());
      const matchCat = !c || (d.category && d.category.toLowerCase() === c.toLowerCase());
      return matchName && matchSeason && matchCat;
    });

    if (sort === 'rating')     list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
    if (sort === 'budgetAsc')  list.sort((a, b) => (a.budget || 0) - (b.budget || 0));
    if (sort === 'budgetDesc') list.sort((a, b) => (b.budget || 0) - (a.budget || 0));

    return list;
  }

  function onFilterChange() {
    currentPage = 0; // Reset to first page
    applyFiltersAndPaginate();
  }

  function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('filterSeason').value = '';
    document.getElementById('filterCategory').value = '';
    document.getElementById('sortBy').value = '';
    currentPage = 0;
    applyFiltersAndPaginate();
  }

  function applyFiltersAndPaginate() {
    document.getElementById('loader').style.display = 'none';
    const filtered = getFilteredDestinations();
    const totalCount = filtered.length;
    const totalPages = Math.ceil(totalCount / PAGE_SIZE) || 1;

    if (currentPage >= totalPages) currentPage = Math.max(0, totalPages - 1);

    const startIdx = currentPage * PAGE_SIZE;
    const endIdx = Math.min(startIdx + PAGE_SIZE, totalCount);
    const pageItems = filtered.slice(startIdx, endIdx);

    document.getElementById('resultsCountBadge').textContent = `${totalCount} Destination${totalCount === 1 ? '' : 's'}`;

    renderGrid(pageItems, totalCount);
    renderPagination(totalCount, totalPages, startIdx, endIdx);
  }

  function renderGrid(items, totalCount) {
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const pagWrapper = document.getElementById('paginationWrapper');

    if (!items || items.length === 0) {
      grid.style.display = 'none';
      empty.classList.remove('d-none');
      pagWrapper.classList.add('d-none');
      return;
    }

    empty.classList.add('d-none');
    grid.style.display = 'grid';
    pagWrapper.classList.remove('d-none');

    grid.innerHTML = items.map(d => {
      const isFav = userFavoriteIds.has(d.destinationId);
      return `
      <div class="card destination-card">
        <button type="button" class="card-fav-btn ${isFav ? 'active' : ''}" 
                onclick="toggleFavorite(event, ${d.destinationId})" 
                title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
          ${isFav ? '❤️' : '🤍'}
        </button>

        <div onclick="window.location.href='destination-detail.html?id=${d.destinationId}'" style="cursor:pointer">
          ${d.imageUrl 
            ? `<img src="${d.imageUrl}" alt="${d.name}" class="card-img" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'card-img-placeholder\\'>🏝️</div>';"/>` 
            : `<div class="card-img-placeholder">🏝️</div>`
          }
          <div class="card-body">
            <div class="d-flex justify-between align-center mb-1">
              <span class="badge badge-teal">${d.season || 'Any Season'}</span>
              <span class="badge badge-gold">${d.category || 'Travel'}</span>
            </div>
            <h3 class="card-title">${d.name}</h3>
            <p class="card-text">${d.description || ''}</p>
            <div class="card-meta">
              <div class="rating">⭐ ${d.rating != null ? d.rating.toFixed(1) : '—'}</div>
              <div class="text-teal fw-700">${API.formatCurrency(d.budget)}<small class="text-secondary"> /person</small></div>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function renderPagination(totalCount, totalPages, startIdx, endIdx) {
    const info = document.getElementById('paginationInfo');
    const pg = document.getElementById('pagination');

    if (totalCount === 0) {
      info.textContent = '';
      pg.innerHTML = '';
      return;
    }

    info.textContent = `Showing ${startIdx + 1}–${endIdx} of ${totalCount} destinations (Page ${currentPage + 1} of ${totalPages})`;

    if (totalPages <= 1) {
      pg.innerHTML = '';
      return;
    }

    let html = `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''} title="Previous 10">‹ Prev</button>`;
    
    for (let i = 0; i < totalPages; i++) {
      if (i === 0 || i === totalPages - 1 || (i >= currentPage - 1 && i <= currentPage + 1)) {
        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i + 1}</button>`;
      } else if (i === currentPage - 2 || i === currentPage + 2) {
        html += `<span style="padding:0 4px;color:var(--text-muted)">…</span>`;
      }
    }

    html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''} title="Next 10">Next ›</button>`;
    pg.innerHTML = html;
  }

  function goToPage(page) {
    currentPage = page;
    applyFiltersAndPaginate();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function toggleFavorite(event, destinationId) {
    event.stopPropagation();
    const btn = event.currentTarget;
    const isFav = userFavoriteIds.has(destinationId);

    try {
      if (isFav) {
        await API.del(`/favorites/${destinationId}`, token);
        userFavoriteIds.delete(destinationId);
        btn.classList.remove('active');
        btn.innerHTML = '🤍';
        btn.title = 'Add to favorites';
        API.showToast('Removed from favorites', 'info');
      } else {
        await API.post(`/favorites/${destinationId}`, {}, token);
        userFavoriteIds.add(destinationId);
        btn.classList.add('active');
        btn.innerHTML = '❤️';
        btn.title = 'Remove from favorites';
        API.showToast('Added to favorites! ❤️', 'success');
      }
    } catch (err) {
      API.showToast(err.message || 'Could not update favorites', 'error');
    }
  }

  loadData();
</script>
</body>
</html>
